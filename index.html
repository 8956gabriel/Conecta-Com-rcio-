<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta Comércio · Ivatuba - PR</title>
    <meta name="description" content="Plataforma independente para fortalecer o comércio local de Ivatuba - PR." />
    <meta name="theme-color" content="#0A5AA8" />
    <link rel="canonical" href="https://conecta-com-rcio.vercel.app/" />

    <!-- App instalável (PWA) — "Adicionar à tela inicial" no celular -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />

    <!-- Open Graph (compartilhamento no WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Conecta Comércio" />
    <meta property="og:title" content="Conecta Comércio · Ivatuba - PR" />
    <meta property="og:description" content="Plataforma independente para fortalecer o comércio local de Ivatuba - PR. Empresas, produtos, vagas, cursos e eventos da cidade em um só lugar." />
    <meta property="og:url" content="https://conecta-com-rcio.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Conecta Comércio · Ivatuba - PR" />
    <meta name="twitter:description" content="Plataforma independente para fortalecer o comércio local de Ivatuba - PR." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registra o service worker pra permitir "Adicionar à tela inicial"
      // (PWA) e deixar o retorno ao site um pouco mais rápido.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
